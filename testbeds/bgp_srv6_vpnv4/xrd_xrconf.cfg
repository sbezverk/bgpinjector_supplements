! XR_EVERY_BOOT_CONFIG consumes this file as a sequence of CLI commands.
! Use fully qualified commands so that a previous command cannot leave the
! loader in a nested configuration mode.
hostname xrd-srv6-vpnv4
logging console debugging
!
username gobmp
username gobmp group root-lr
username gobmp group cisco-support
username gobmp password 7 13021810061C557878
!
interface Loopback0
interface Loopback0 description BGP Update-Source / Node Loopback
interface Loopback0 ipv6 address fd04:b400::107/128
interface MgmtEth0/RP0/CPU0/0
interface MgmtEth0/RP0/CPU0/0 ipv4 address 172.31.0.2 255.255.255.0
interface GigabitEthernet0/0/0/0
interface GigabitEthernet0/0/0/0 description Docker data network to bgpinjector and GoBMP
interface GigabitEthernet0/0/0/0 ipv4 address 172.30.0.2 255.255.255.0
interface GigabitEthernet0/0/0/0 ipv6 address fd04:b400:ffff::107/64
!
route-policy PASS-ALL
  pass
end-policy
!
segment-routing srv6
segment-routing srv6 encapsulation
segment-routing srv6 encapsulation source-address fd04:b400::107
segment-routing srv6 locators
segment-routing srv6 locators locator LOC0
segment-routing srv6 locators locator LOC0 prefix fc04:b400:107::/64
!
! The production SRv6 transport resolves the remote PE loopback. In this
! single-router lab, a host route keeps the injected IPv6 BGP next hop
! resolvable without adding a second router.
router static
router static address-family ipv6 unicast
router static address-family ipv6 unicast fd04:b400::108/128 Null0
! Keep both Prefix-SID locators resolvable so the initial and replacement
! advertisements can be tested without changing XR configuration mid-test.
router static address-family ipv6 unicast fc04:b400:108::/48 Null0
router static address-family ipv6 unicast fc04:b400:109::/48 Null0
! Route to the RR loopback through the directly connected Docker transit link.
router static address-family ipv6 unicast fd04:b400::706/128 fd04:b400:ffff::706
!
vrf SRV6-VPN
vrf SRV6-VPN address-family ipv4 unicast
vrf SRV6-VPN address-family ipv4 unicast import route-target
vrf SRV6-VPN address-family ipv4 unicast import route-target 26727:30022
vrf SRV6-VPN address-family ipv4 unicast import route-target 26727:39500
vrf SRV6-VPN address-family ipv4 unicast export route-target
vrf SRV6-VPN address-family ipv4 unicast export route-target 26727:30022
vrf SRV6-VPN address-family ipv4 unicast export route-target 26727:39500
!
bmp server 1
bmp server 1 host 172.30.0.4 port 5000
bmp server 1 description GoBMP Collector
bmp server 1 update-source GigabitEthernet0/0/0/0
bmp server 1 flapping-delay 60
!
router bgp 26727
router bgp 26727 bgp router-id 10.65.1.107
router bgp 26727 bgp update-delay 0
router bgp 26727 address-family vpnv4 unicast
router bgp 26727 address-family vpnv4 unicast additional-paths receive
router bgp 26727 segment-routing srv6
router bgp 26727 segment-routing srv6 locator LOC0
router bgp 26727 neighbor fd04:b400::706
router bgp 26727 neighbor fd04:b400::706 remote-as 26727
router bgp 26727 neighbor fd04:b400::706 description iBGP to bgpinjector (SRv6 RR emulator)
router bgp 26727 neighbor fd04:b400::706 bmp-activate server 1
router bgp 26727 neighbor fd04:b400::706 update-source Loopback0
router bgp 26727 neighbor fd04:b400::706 address-family vpnv4 unicast
router bgp 26727 neighbor fd04:b400::706 address-family vpnv4 unicast route-policy PASS-ALL in
router bgp 26727 neighbor fd04:b400::706 address-family vpnv4 unicast route-policy PASS-ALL out
router bgp 26727 vrf SRV6-VPN
router bgp 26727 vrf SRV6-VPN rd 26727:30022
router bgp 26727 vrf SRV6-VPN address-family ipv4 unicast
router bgp 26727 vrf SRV6-VPN address-family ipv4 unicast segment-routing srv6
router bgp 26727 vrf SRV6-VPN address-family ipv4 unicast segment-routing srv6 alloc mode per-vrf
router bgp 26727 vrf SRV6-VPN address-family ipv4 unicast redistribute connected
!
ssh server v2
ssh server vrf default
end
