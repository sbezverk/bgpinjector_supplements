hostname P3
!
username cisco
 group root-lr
 group cisco-support
 secret 0 cisco123
!
interface Loopback0
 ipv4 address 10.0.0.23 255.255.255.255
 ipv6 address fc00::23/128
!
interface MgmtEth0/RP0/CPU0/0
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description P1--GigabitEthernet0/0/0/1
 ipv4 address 10.1.5.1 255.255.255.254
 ipv6 address fd00:0:1:5::1/127
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description P2--GigabitEthernet0/0/0/2
 ipv4 address 10.1.8.1 255.255.255.254
 ipv6 address fd00:0:1:8::1/127
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description PE2--GigabitEthernet0/0/0/0
 ipv4 address 10.1.9.0 255.255.255.254
 ipv6 address fd00:0:1:9::/127
 no shutdown
!
router isis SRv6
 is-type level-2-only
 net 49.0000.0100.0000.0023.00
 address-family ipv4 unicast
  metric-style wide
 !
 address-family ipv6 unicast
  metric-style wide
  segment-routing srv6
   locator uSID_Algo0
  !
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
  !
  address-family ipv6 unicast
  !
 !
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
  !
  address-family ipv6 unicast
  !
 !
 interface GigabitEthernet0/0/0/1
  point-to-point
  address-family ipv4 unicast
  !
  address-family ipv6 unicast
  !
 !
 interface GigabitEthernet0/0/0/2
  point-to-point
  address-family ipv4 unicast
  !
  address-family ipv6 unicast
  !
 !
!
segment-routing
 srv6
  encapsulation
   source-address fc00::23
  !
  locators
   locator uSID_Algo0
    micro-segment behavior unode psp-usd
    prefix fcbb:bb00:23::/48
   !
  !
 !
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 MgmtEth0/RP0/CPU0/0 192.168.240.1
 !
 address-family ipv6 unicast
  ::/0 MgmtEth0/RP0/CPU0/0 fd04:b400:20::1
 !
!
ssh server v2
ssh server vrf default
ssh server rate-limit 600
